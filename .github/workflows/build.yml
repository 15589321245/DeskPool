name: Build DeskPool

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: swift run PhysicsTests
      - run: ./build-app.sh
      - run: |
          codesign --verify --deep --strict build/DesktopIconBilliards.app
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/DesktopIconBilliards.app/Contents/Info.plist)
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version v$version"
              exit 1
            fi
          fi
          ditto -c -k --sequesterRsrc --keepParent build/DesktopIconBilliards.app DeskPool-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPool-macOS-${{ matrix.arch }}
          path: DeskPool-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m unittest discover -s windows -v
      - name: Check Tk and Windows desktop icons
        run: python windows/smoke_test.py
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name DeskPool --icon assets/deskpool.ico --add-data "assets/deskpool.png:assets" windows/deskpool.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPool-Windows-x64
          path: |
            dist/DeskPool.exe
            README.md
            README.en.md
            LICENSE
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release downloads
        shell: bash
        run: |
          mkdir release
          for arch in arm64 x64; do
            archive="DeskPool-macOS-$arch"
            cp "artifacts/$archive/$archive.zip" "release/DeskPool-$GITHUB_REF_NAME-macOS-$arch.zip"
          done
          test -s artifacts/DeskPool-Windows-x64/dist/DeskPool.exe
          zip -j "release/DeskPool-$GITHUB_REF_NAME-Windows-x64.zip" \
            artifacts/DeskPool-Windows-x64/dist/DeskPool.exe \
            artifacts/DeskPool-Windows-x64/LICENSE
          for archive in release/*.zip; do unzip -tq "$archive"; done
      - name: Publish after all downloads are ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$is_draft" == "false" ]]; then
            echo "Release $GITHUB_REF_NAME is already published."
            exit 0
          elif [[ "$is_draft" != "true" ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "DeskPool $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
